[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-accelerator"
version = "0.1.0"
description = "Chunked NumPy baseline for Monte Carlo insurance projections"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
gpu-cuda12 = ["cupy-cuda12x>=14,<15"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
